<!DOCTYPE html>
<html>
<head>
    <title>Event Handler Lab</title>
</head>
<body>

<h1>Event Handler Lab</h1>

<form id="myForm">

    <label>Choose an option:</label>
    <select id="options">
        <option value="">-- Select One --</option>
        <option value="show">Show Checkbox</option>
        <option value="hide">Hide Checkbox</option>
    </select>

    <br><br>

    <div id="checkboxContainer" style="display:none;">
        <input type="checkbox" id="agree">
        <label for="agree">I agree to the terms</label>
    </div>

    <br>

    <label>Type something and press Enter:</label>
    <input type="text" id="textInput" placeholder="Press Enter inside this box.">

    <br><br>

    <button type="submit">Submit</button>

</form>

<script src="script.js"></script>

</body>
</html>
